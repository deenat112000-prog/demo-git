<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Bar Example</title>
  <link rel="stylesheet" href="styles.css">
</head>
<a href="form.html">go to formtable</a>
<body>
  <div class="search-container">
    <input type="text" placeholder="Search..." class="search-input">
    <button class="search-button">Go</button>
  </div>
  
</body>
</html>

<style>
  body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 200vh;
}

.search-container {
  display: flex;
  align-items: center;
  background-color: white;
  border-radius: 35px;
  padding: 10px 20px;

  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.search-input {
  border: none;
  outline: none;
  padding: 10px;
  padding-right: 100px;
  
  font-size: 16px;
  width: 200px;
}

.search-button {
  background-color: #007BFF;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 16px;
}

.search-button:hover {
  background-color: #0056b3;
}
</style>
